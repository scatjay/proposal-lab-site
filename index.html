<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>提案室·實驗工坊</title>
<link rel="stylesheet" href="tokens.css?v=2"><link rel="stylesheet" href="lab.css?v=2">
</head><body><div class="wrap">

<section id="login" hidden>
  <h1>提案室·實驗工坊</h1>
  <p class="muted">這是白名單開放的實驗空間。請用楊老師登記的個人 Google 帳號登入。</p>
  <div class="card"><div class="row"><button id="gBtn">用 Google 登入</button><span id="mockBox" hidden><input id="mockEmail" placeholder="（測試模式）信箱" style="width:220px"> <button id="mockGo" class="ghost">進入</button></span></div><p id="loginMsg" class="muted"></p></div>
</section>

<section id="denied" hidden>
  <h1>這個帳號還不在名單裡</h1>
  <div class="card"><p>目前登入的是 <code id="deniedMail"></code>。請換成楊老師登記的那個 Google 帳號，或回信告訴楊老師你用的是哪個信箱。</p><button id="deniedOut" class="ghost">換帳號</button></div>
</section>

<section id="naming" hidden>
  <h1>先幫你的助理取個名字</h1>
  <p class="muted">這個助理會一直陪你做這個實驗。名字和個性都由你決定。</p>
  <div class="card"><label for="nm">1. 它叫什麼名字？</label><input id="nm" maxlength="12" placeholder="例如：阿福、Nova（隨你取）">
    <label for="ps">2. 它說話的個性？（可以先空白）</label><textarea id="ps" placeholder="例如：像毒舌但可靠的學姊；預設是簡潔、會先問再動手"></textarea>
    <div class="row" style="margin-top:12px"><button id="nmGo">就叫這個名字</button><span id="nmErr" class="err"></span></div></div>
</section>

<section id="app" hidden>
  <div class="row" style="justify-content:space-between"><div><h1 id="hi"></h1><span class="tag" id="who"></span> <span class="tag ok" id="saved">已儲存</span></div><button id="out" class="ghost">登出</button></div>
  <div id="guide"></div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</section>

<section id="fatal" hidden><div class="card"><h2>出了點問題</h2><p id="fatalMsg" class="err"></p></div></section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="lab.js?v=4"></script>
<script src="starter.js?v=1"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var MODELS = ['gemini-2.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3-flash-preview'];   /* 實際可用型號由楊老師的代理程式再限制一次 */
  var JARVIS_ON = false;   /* Jarvis（學生自己的 Claude CLI 助理）等楊老師交付 Pro 帳號後才開：改 true 即恢復取名、接手與設定欄位 */
  var DEFAULT_CAP = 1000;   /* 台幣，整個實驗期間累積；增加要楊老師核准（寫入 lab/spend/<代碼>/capNtd） */
  var ctx, P, S, G = {}, tab = 'home', timer = null;
  function show(id) { ['login', 'denied', 'naming', 'app', 'fatal'].forEach(function (k) { $(k).hidden = (k !== id); }); }
  function el(tag, attrs, kids) { var e = document.createElement(tag); Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }); (kids || []).forEach(function (c) { e.appendChild(c); }); return e; }
  function path(x) { return 'lab/u/' + ctx.code + '/' + x; }
  function ev(kind) { var id = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); ctx.db.set(path('events/' + id), JSON.stringify({ k: kind, t: Date.now() })).catch(function () {}); }
  function blank() { return { v: 1, chars: [], scenes: [], story: { concept: '', playerRole: '', opening: '', goal: '', ending: '', gm: '', breakWall: false } }; }

  /* 儲存 */
  function mark(txt, cls) { var s = $('saved'); s.textContent = txt; s.className = 'tag ' + (cls || ''); }
  function save() { mark('儲存中…', ''); clearTimeout(timer); timer = setTimeout(function () {
    var s = JSON.stringify(P);
    if (s.length > 80000) { mark('內容太長，未儲存', 'warn'); return; }
    ctx.db.set(path('project'), s).then(function () { mark('已儲存', 'ok'); ev('save'); renderGuide(); }).catch(function (e) { mark('儲存失敗', 'warn'); console.error(e); }); }, 900); }
  function saveSettings() { var o = { model: S.model || MODELS[0], jarvisName: S.jarvisName || '', updatedAt: Date.now() }; return ctx.db.set(path('settings'), o); }

  /* 欄位工具 */
  function field(label, val, onInput, opts) { opts = opts || {}; var f = el(opts.multi ? 'textarea' : 'input', { id: opts.id || '' }); f.value = val || ''; if (opts.ph) f.placeholder = opts.ph;
    f.addEventListener('input', function () { onInput(f.value); save(); depthRefresh(); }); var l = el('label', { text: label }); if (opts.id) l.setAttribute('for', opts.id); var w = el('div', {}, [l, f]); if (opts.hint) w.appendChild(el('div', { class: 'muted', text: opts.hint })); return w; }
  function lines(a) { return (a || []).join('\n'); } function unlines(s) { return s.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }

  /* 分頁 */
  var TABS = [['home', '你在這裡'], ['chars', '角色'], ['scenes', '場景'], ['story', '故事'], ['chat', '試聊'], ['evo', '進化'], ['set', '設定']];
  function renderTabs() { var t = $('tabs'); t.innerHTML = ''; TABS.forEach(function (x) { var b = el('button', { text: x[1], class: x[0] === tab ? 'on' : 'ghost' }); b.onclick = function () { tab = x[0]; renderTabs(); renderPane(); }; t.appendChild(b); }); }
  function renderPane() { var p = $('pane'); p.innerHTML = ''; ({ home: pHome, chars: pChars, scenes: pScenes, story: pStory, chat: pChat, evo: pEvo, set: pSet })[tab](p); renderGuide(); }

  function checks() { var c = P.chars, st = P.story, out = [];
    out.push([c.length >= 1, '至少一個角色']);
    out.push([c.some(function (x) { return (x.bio || '').length >= 40 && (x.speech || '').length >= 20; }), '角色有寫夠深（簡介 40 字、說話方式 20 字以上）']);
    out.push([P.scenes.length >= 1 && P.scenes.some(function (s) { return s.rooms && s.rooms.length; }), '至少一個場景和一個房間']);
    out.push([(st.concept || '').length >= 10, '故事的高概念（一句話）']);
    out.push([(st.goal || '').length > 0 && (st.ending || '').length > 0, '故事有目標和結局']);
    return out; }

  /* 新手引導：一次一步、可跳過、做完（或全部跳過）就消失。進度由資料自己算，跳過的記在這台裝置。 */
  var FL = { chat: 0, mark: 0 };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } } function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function gk(x) { return 'labob.' + (ctx && ctx.code) + '.' + x; }
  var GSTEPS = [
    ['chars', '先替第一個角色取名字（用化名）', function () { return P.chars.some(function (c) { return (c.name || '').trim(); }); }],
    ['chars', '寫簡介（40 字以上）和說話方式（20 字以上）', function () { return P.chars.some(function (c) { return (c.bio || '').length >= 40 && (c.speech || '').length >= 20; }); }],
    ['chars', '在「性格座標」點一下，決定他話多或話少、重感受或重道理', function () { return P.chars.some(function (c) { return c.coord; }); }],
    ['scenes', '建一個場景，加一個房間', function () { return P.scenes.some(function (s) { return s.rooms && s.rooms.length; }); }],
    ['story', '寫故事的高概念（一句話，讓人想看下去）', function () { return (P.story.concept || '').length >= 10; }],
    ['chat', '到「試聊」跟你的角色說一句話', function () { return FL.chat > 0; }],
    ['chat', '在角色的回覆下面標「像」「不像」或「卡住」', function () { return FL.mark > 0; }]
  ];
  var GSEEN = {};
  function glog(kind, i) { var key = kind + i; if (GSEEN[key]) return; GSEEN[key] = 1; var lk = gk('l.' + key); if (lsGet(lk)) return; lsSet(lk, '1'); ev('guide-' + kind + (i === '' ? '' : '-' + i)); }   /* 每個引導事件每台裝置只記一次 */
  function renderGuide() {
    var g = $('guide'); if (!g) return; g.innerHTML = ''; if (!ctx || !P || lsGet(gk('off')) === '1') return;
    var skip = []; try { skip = JSON.parse(lsGet(gk('skip')) || '[]'); } catch (e) {}
    var i = -1; for (var k = 0; k < GSTEPS.length; k++) { if (!GSTEPS[k][2]() && skip.indexOf(k) < 0) { i = k; break; } }
    if (i < 0) { glog('done', ''); return; }
    glog('show', i);
    var go = el('button', { text: '帶我去' }), sk = el('button', { class: 'ghost', text: '跳過這步' }), off = el('button', { class: 'ghost', text: '全部跳過' });
    go.onclick = function () { ev('guide-go-' + i); tab = GSTEPS[i][0]; renderTabs(); renderPane(); };
    sk.onclick = function () { ev('guide-skip-' + i); skip.push(i); lsSet(gk('skip'), JSON.stringify(skip)); renderGuide(); };
    off.onclick = function () { ev('guide-off-' + i); lsSet(gk('off'), '1'); renderGuide(); };
    g.appendChild(el('div', { class: 'card', style: 'margin-bottom:12px' }, [el('span', { class: 'tag', text: '新手引導　第 ' + (i + 1) + ' / ' + GSTEPS.length + ' 步' }), el('p', { text: GSTEPS[i][1], style: 'font-weight:700;margin:8px 0' }), el('div', { class: 'row' }, [go, sk, off])]));
  }

  /* 起手範例 */
  function projectEmpty() { return !P.chars.some(function (c) { return c.name || c.bio; }) && !P.scenes.length && !(P.story.concept || ''); }
  function templateCard() {
    var card = el('div', { class: 'card' }, [el('h2', { text: '起手範例（可複製後改成自己的）' }), el('p', { class: 'muted', text: '兩個方向各一組：1 個場景、2 個角色、1 段故事開頭，人物都是化名。選一個套用，再慢慢改成你自己的。' })]);
    LABX.templates.forEach(function (t) { var b = el('button', { text: '套用這組' }), box = el('div', { style: 'margin:10px 0;padding-top:8px;border-top:var(--bw-s) solid var(--line)' }, [el('strong', { text: t.name }), el('div', { class: 'muted', text: t.desc })]);
      b.onclick = function () { if (!projectEmpty() && b.dataset.arm !== '1') { b.dataset.arm = '1'; b.textContent = '會取代現有內容，再按一次確認'; setTimeout(function () { b.dataset.arm = ''; b.textContent = '套用這組'; }, 6000); return; }
        var c = JSON.parse(JSON.stringify(t.project)); P.chars = c.chars; P.scenes = c.scenes; P.story = Object.assign(blank().story, c.story); save(); ev('template-' + t.id); renderPane(); renderGuide(); };
      box.appendChild(el('div', { style: 'margin-top:6px' }, [b])); card.appendChild(box); });
    return card;
  }

  /* 匯出 Markdown（給期末作業） */
  function exportCard() {
    var card = el('div', { class: 'card' }, [el('h2', { text: '匯出成 Markdown（給期末作業）' }), el('p', { class: 'muted', text: '把故事、場景、角色、進化紀錄和試聊標註整理成一份文件。' })]);
    var go = el('button', { text: '產生匯出內容' }), out = el('div'); card.appendChild(go); card.appendChild(out);
    go.onclick = function () { out.textContent = '整理中…';
      Promise.all([ctx.db.get(path('gens')), ctx.db.get(path('marks')), ctx.db.get(path('req')), ctx.db.get(path('out')), ctx.db.get('lab/spend/' + ctx.code)]).then(function (r) {
        var sp = r[4] || {}, md = LABX.exportMd({ project: P, gens: r[0] || {}, marks: r[1] || {}, req: r[2] || {}, out: r[3] || {}, model: S.model || MODELS[0], used: Number(sp.ntd) || 0, cap: (sp.capNtd === undefined || sp.capNtd === null) ? DEFAULT_CAP : sp.capNtd });
        out.innerHTML = ''; var ta = el('textarea', { readonly: 'readonly', rows: '14', 'aria-label': '匯出的 Markdown', style: 'margin-top:10px' }); ta.value = md;
        var dl = el('button', { text: '下載 .md 檔' }), cp = el('button', { class: 'ghost', text: '複製全文' }), msg = el('span', { class: 'muted' });
        dl.onclick = function () { try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' })); a.download = '提案室實驗-' + new Date().toISOString().slice(0, 10) + '.md'; document.body.appendChild(a); a.click(); a.remove(); ev('export'); msg.textContent = '已下載'; } catch (e) { msg.textContent = '下載沒成功，請用複製'; } };
        cp.onclick = function () { try { navigator.clipboard.writeText(md).then(function () { msg.textContent = '已複製'; }, function () { ta.select(); msg.textContent = '請按 Ctrl+C'; }); } catch (e) { ta.select(); msg.textContent = '請按 Ctrl+C'; } };
        out.appendChild(ta); out.appendChild(el('div', { class: 'row', style: 'margin-top:8px' }, [dl, cp, msg]));
      }).catch(function (e) { out.textContent = '匯出失敗：' + (e && e.code || e); }); };
    return card;
  }

  function pHome(p) {
    var cs = checks(), done = cs.filter(function (x) { return x[0]; }).length, nxt = cs.filter(function (x) { return !x[0]; })[0];
    var c1 = el('div', { class: 'card' }, [el('span', { class: 'tag', text: '今天的你' }), el('h2', { text: '你現在是這個實驗的設計師' }),
      el('p', { text: '這一頁告訴你：你在哪、能做什麼、下一步是什麼。' })]);
    var list = el('ul'); cs.forEach(function (x) { list.appendChild(el('li', { text: (x[0] ? '✓ ' : '○ ') + x[1] })); });
    var c2 = el('div', { class: 'card' }, [el('h2', { text: '完成度 ' + done + ' / ' + cs.length }), list,
      el('p', { class: 'muted', text: nxt ? '下一步：' + nxt[1] : '都完成了，可以請楊老師來看，或讓角色再深一點。' })]);
    var line = '我的助理叫「' + (S.jarvisName || '') + '」，個性：' + (S.persona || '簡潔、會先問再動手') + '。請存入 jarvis/memory/identity.json。';
    var cp = el('button', { class: 'ghost', text: '複製' }); cp.onclick = function () { try { navigator.clipboard.writeText(line); } catch (e) {} };
    var c3 = el('div', { class: 'card' }, [el('h2', { text: '讓助理接手' }), el('p', { text: '把下面這一行貼給你的助理（Claude CLI），它就知道自己叫什麼：' }), el('p', {}, [el('code', { text: line })]), cp]);
    p.appendChild(c1); p.appendChild(c2); if (JARVIS_ON) p.appendChild(c3); p.appendChild(exportCard()); if (projectEmpty()) p.insertBefore(templateCard(), p.firstChild); else p.appendChild(templateCard()); }


  /* 性格座標（沿用痛點急診室人物座標圖）：橫軸 話少 ↔ 話多，縱軸 先在意感受 ↔ 先在意道理。格內位置只代表程度，不是分類。 */
  var QUADS = { IF: ['話少、先在意感受', '要先承接處境，才會開口', '#3d6fe0', '#e6edfb'], IT: ['話少、先在意道理', '一句話說清來意，問他做過的一步', '#14a08c', '#def4f0'],
                EF: ['話多、先在意感受', '話多又容易離題，先接住再拉回', '#f08300', '#fff1dc'], ET: ['話多、先在意道理', '要結論和指標，先講來意和時間', '#6aa81a', '#eef6dc'] };
  function quadOf(co) { return (co.x < 0.5 ? 'I' : 'E') + (co.y < 0.5 ? 'F' : 'T'); }
  function coordPad(c, i) {
    var co = c.coord || { x: 0.5, y: 0.5 }, set = !!c.coord, wrap = el('div', { style: 'margin:12px 0' });
    wrap.appendChild(el('label', { text: '性格座標（點一下或拖曳，也能用方向鍵）' }));
    var pad = el('div', { id: 'cp' + i, tabindex: '0', role: 'application', 'aria-label': '性格座標：橫軸話少到話多，縱軸感受到道理', style: 'position:relative;height:200px;border:var(--bw) solid var(--ink);border-radius:var(--r-m);overflow:hidden;touch-action:none;cursor:crosshair;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr' });
    ['IF', 'EF', 'IT', 'ET'].forEach(function (k) { pad.appendChild(el('div', { style: 'background:' + QUADS[k][3] + ';color:#1e1e1e;font-size:12px;padding:4px 6px;border:1px solid ' + QUADS[k][2], text: QUADS[k][0] })); });
    var puck = el('div', { style: 'position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #1e1e1e;background:#ffd43b;box-shadow:2px 2px 0 #1e1e1e;pointer-events:none' }); pad.appendChild(puck);
    var info = el('div', { class: 'muted', style: 'margin-top:6px' });
    function draw() { puck.style.left = (co.x * 100) + '%'; puck.style.top = (co.y * 100) + '%'; puck.style.display = set ? '' : 'none'; var q = QUADS[quadOf(co)];
      info.textContent = set ? '現在在「' + q[0] + '」：' + q[1] + '。格內位置只代表程度，不是分類。' : '還沒設定。點一下座標圖，系統會照這個調整他說話的長短與重心。'; }
    function put(x, y) { co.x = Math.max(0, Math.min(1, x)); co.y = Math.max(0, Math.min(1, y)); co.x = Math.round(co.x * 100) / 100; co.y = Math.round(co.y * 100) / 100; set = true; c.coord = { x: co.x, y: co.y }; draw(); save(); depthRefresh(); }
    function at(e) { var r = pad.getBoundingClientRect(); put((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); }
    var down = false; pad.addEventListener('pointerdown', function (e) { down = true; try { pad.setPointerCapture(e.pointerId); } catch (x) {} at(e); });
    pad.addEventListener('pointermove', function (e) { if (down) at(e); }); pad.addEventListener('pointerup', function () { down = false; });
    pad.addEventListener('keydown', function (e) { var d = { ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, -0.1], ArrowDown: [0, 0.1] }[e.key]; if (d) { e.preventDefault(); put(co.x + d[0], co.y + d[1]); } });
    wrap.appendChild(el('div', { class: 'muted', style: 'display:flex;justify-content:space-between', }, [el('span', { text: '← 話少' }), el('span', { text: '話多 →' })]));
    wrap.appendChild(pad); wrap.appendChild(el('div', { class: 'muted', text: '↑ 先在意感受　　↓ 先在意道理' })); wrap.appendChild(info); draw(); return wrap; }


  /* 設定深度：討論記錄裡的結論——角色「呆」多半是設定太短。用規則算，不經 AI；沒達標的項目附一句怎麼補。 */
  function depthOf(c) {
    var it = [
      [10, (c.name || '').trim().length > 0, '有名字（化名）', '先取一個名字'],
      [15, (c.bio || '').length >= 40, '簡介 40 字以上', '寫年齡、身分、這個場景裡他正在做什麼'],
      [10, (c.bio || '').length >= 80, '簡介 80 字以上（更完整）', '加上他最近發生的一件事，角色會更有層次'],
      [15, (c.speech || '').length >= 20, '說話方式 20 字以上', '寫句子長短、口頭禪、情緒，最好舉一句他會說的話'],
      [15, (c.knows || []).length >= 3, '他知道至少 3 件事', '多寫幾件他確定知道的事，角色才有東西可聊'],
      [10, (c.unknown || []).length >= 1, '寫了他不知道的事', '寫一件他不知道的事，才不會什麼都答得出來'],
      [15, (c.rules || []).length >= 2, '至少 2 條規則', '例如：每次最多兩句、被問到某件事要猶豫'],
      [10, !!c.coord, '設了性格座標', '在座標圖點一下，決定話多話少、重感受或重道理']
    ];
    var score = 0; it.forEach(function (x) { if (x[1]) score += x[0]; });
    return { score: score, items: it };
  }
  function depthCard(c) {
    var box = el('div', { class: 'card', style: 'background:var(--soft-y);margin:8px 0' });
    function draw() { var d = depthOf(c), lvl = d.score >= 85 ? ['夠深', 'ok'] : d.score >= 60 ? ['可以了，還能再深', ''] : ['還淺，角色容易呆', 'warn']; box.innerHTML = '';

    function load() { Promise.all([ctx.db.get(path('req')), ctx.db.get(path('out')), ctx.db.get(path('marks')), ctx.db.get('lab/spend/' + ctx.code), ctx.db.get(path('mem'))]).then(function (r) {
      var mem = r[4] || {}; curS = sesOf(r[0] || {}, mem); var sp = r[3] || {}, cap = (sp.capNtd === undefined || sp.capNtd === null) ? DEFAULT_CAP : Number(sp.capNtd), used = Number(sp.ntd) || 0;
      info.textContent = '目前型號：' + (S.model || MODELS[0]) + '　累積 NT$ ' + fmt(used) + ' ／ ' + fmt(cap); go.disabled = used >= cap; if (used >= cap) $('chmsg').textContent = '額度用完了，需要增加請向楊老師提出。';
      render(r[0] || {}, r[1] || {}, r[2] || {}); renderMem(mem); var pend = Object.keys(r[0] || {}).some(function (k) { return !(r[1] || {})[k]; }) || Object.keys(mem).some(function (k) { return (J(mem[k]) || {}).p; });
      clearTimeout(chatPoll); if (pend && tab === 'chat') chatPoll = setTimeout(load, 1500);
    }).catch(function (e) { box.textContent = '讀不到對話：' + (e && e.code || e); }); }
    go.onclick = function () { var m = inp.value.trim(); if (!m) { $('chmsg').textContent = '先打一句話'; return; } if (m.length > 300) { $('chmsg').textContent = '太長了，300 字內'; return; }
      var id = 'r' + Date.now(); go.disabled = true; $('chmsg').textContent = '';
      ctx.db.set(path('req/' + id), JSON.stringify({ c: chatCi, s: curS, r: chatRoom, m: m, t: Date.now() })).then(function () { inp.value = ''; ev('chat'); FL.chat++; go.disabled = false; load(); renderGuide(); }).catch(function (e) { go.disabled = false; $('chmsg').textContent = '送出失敗：' + (e && e.code || e); }); };
    load();
  }
  function J(s) { try { return JSON.parse(s); } catch (e) { return null; } }

  function pSet(p) { var card = el('div', { class: 'card' });
    if (JARVIS_ON) card.appendChild(field('助理的名字', S.jarvisName, function (v) { S.jarvisName = v; $('hi').textContent = (v || '助理') + ' 在這裡'; clearTimeout(pSet.t); pSet.t = setTimeout(saveSettings, 800); }, { id: 'sjn' }));
    var ml = el('label', { text: '場上角色用哪個 AI 型號', for: 'smd' }), ms = el('select', { id: 'smd' }); MODELS.forEach(function (m) { var o = el('option', { value: m, text: m }); if ((S.model || MODELS[0]) === m) o.selected = true; ms.appendChild(o); });
    ms.onchange = function () { S.model = ms.value; saveSettings().then(function () { ev('model'); }); }; card.appendChild(el('div', {}, [ml, ms]));
    card.appendChild(el('p', { class: 'muted', text: '型號清單由楊老師決定。' }));
    p.appendChild(card);
    /* 累積花費與上限（由代理程式記帳寫入 lab/spend，你只能看不能改） */
    var sp = el('div', { class: 'card' }); sp.appendChild(el('h2', { text: '累積花費' })); var body = el('div', { text: '讀取中…', class: 'muted' }); sp.appendChild(body); p.appendChild(sp);
    ctx.db.get('lab/spend/' + ctx.code).then(function (x) {
      x = x || {}; var used = Number(x.ntd) || 0, cap = (x.capNtd === undefined || x.capNtd === null) ? DEFAULT_CAP : Number(x.capNtd), pct = cap > 0 ? Math.min(100, Math.round(used / cap * 100)) : 100;
      var full = used >= cap, near = !full && pct >= 80;
      body.className = ''; body.textContent = '';
      body.appendChild(el('div', { class: 'row' }, [el('strong', { text: 'NT$ ' + fmt(used) + ' ／ NT$ ' + fmt(cap), style: 'font-size:20px' }), el('span', { class: 'tag ' + (full ? 'warn' : (near ? '' : 'ok')), text: full ? '已用完，場上角色暫停' : (near ? '快用完了（' + pct + '%）' : '已用 ' + pct + '%') })]));
      body.appendChild(el('div', { style: 'height:14px;margin:8px 0;border:var(--bw-s) solid var(--ink);border-radius:var(--r-pill);background:var(--panel);overflow:hidden' }, [el('div', { style: 'height:100%;width:' + pct + '%;background:' + (full ? 'var(--pop)' : 'var(--mint)') })]));
      body.appendChild(el('div', { class: 'muted', text: '目前型號：' + (S.model || MODELS[0]) + '　場上對話 ' + fmt(x.calls || 0) + ' 次　token 入 ' + fmt(x.tokIn || 0) + '／出 ' + fmt(x.tokOut || 0) }));
      body.appendChild(el('div', { class: 'muted', text: x.updatedAt ? '記帳更新：' + new Date(x.updatedAt).toLocaleString('zh-TW') : '還沒有任何花費紀錄。' }));
      body.appendChild(el('p', { class: 'muted', text: '這是整個實驗期間的累積上限。需要增加，請向楊老師提出。' }));
    }).catch(function (e) { body.textContent = '讀不到花費資料：' + (e && e.code || e); });
  }
  function fmt(n) { n = Number(n) || 0; return n.toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }

  /* 啟動 */
  function boot(c) {
    ctx = c; if (!ctx.code) { ctx.code = ctx.isAdmin ? 'lab-admin-preview' : null; }
    $('who').textContent = ctx.email;
    Promise.all([ctx.db.get(path('settings')), ctx.db.get(path('project')), ctx.db.get(path('gens')), ctx.db.get(path('req')), ctx.db.get(path('marks'))]).then(function (r) {
      S = r[0] || {}; G = r[2] || {}; FL.chat = Object.keys(r[3] || {}).length; FL.mark = Object.keys(r[4] || {}).length; try { P = r[1] ? JSON.parse(r[1]) : blank(); } catch (e) { P = blank(); }
      P.chars = P.chars || []; P.scenes = P.scenes || []; P.story = P.story || blank().story;
      if (JARVIS_ON && !S.jarvisName) { show('naming'); return; } enter();
    }).catch(function (e) { fatal('讀取你的資料失敗：' + (e && e.code || e)); });
  }
  function enter() { $('hi').textContent = JARVIS_ON ? S.jarvisName + ' 在這裡' : '提案室·實驗工坊'; show('app'); renderTabs(); renderPane(); ev('open'); }
  function fatal(m) { $('fatalMsg').textContent = m; show('fatal'); }

  $('nmGo').onclick = function () { var n = $('nm').value.trim(); if (!n) { $('nmErr').textContent = '先取個名字喔'; return; }
    S = { jarvisName: n, model: MODELS[0], persona: $('ps').value.trim() }; saveSettings().then(function () { ev('named'); enter(); }).catch(function (e) { $('nmErr').textContent = '儲存失敗：' + (e && e.code || e); }); };
  $('out').onclick = function () { LAB.signOut(); }; $('deniedOut').onclick = function () { LAB.signOut(); };
  $('gBtn').onclick = function () { $('loginMsg').textContent = '登入中…（會跳出 Google 的視窗）'; var r = LAB.signIn(); if (r && r.catch) r.catch(function (e) { $('loginMsg').textContent = '登入沒有完成：' + (e && e.code || e); }); };
  if (LAB.mock) { $('mockBox').hidden = false; $('gBtn').hidden = true; $('mockGo').onclick = function () { try { localStorage.setItem('labmock.email', $('mockEmail').value.trim().toLowerCase()); } catch (e) {} location.reload(); }; }
  LAB.start({ onReady: boot, onSignedOut: function () { show('login'); },
    onDenied: function (m) { $('deniedMail').textContent = m; show('denied'); }, onError: fatal });
})();
</script></body></html>
