<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>提案室·實驗工坊</title>
<link rel="stylesheet" href="tokens.css?v=2"><link rel="stylesheet" href="lab.css?v=2">
</head><body><div class="wrap">

<section id="login" hidden>
  <h1>提案室·實驗工坊</h1>
  <p class="muted">這是白名單開放的實驗空間。請用楊老師登記的個人 Google 帳號登入。</p>
  <div class="card"><div class="row"><button id="gBtn">用 Google 登入</button><span id="mockBox" hidden><input id="mockEmail" placeholder="（測試模式）信箱" style="width:220px"> <button id="mockGo" class="ghost">進入</button></span></div><p id="loginMsg" class="muted"></p></div>
</section>

<section id="denied" hidden>
  <h1>這個帳號還不在名單裡</h1>
  <div class="card"><p>目前登入的是 <code id="deniedMail"></code>。請換成楊老師登記的那個 Google 帳號，或回信告訴楊老師你用的是哪個信箱。</p><button id="deniedOut" class="ghost">換帳號</button></div>
</section>

<section id="naming" hidden>
  <h1>先幫你的助理取個名字</h1>
  <p class="muted">這個助理會一直陪你做這個實驗。名字和個性都由你決定。</p>
  <div class="card"><label for="nm">1. 它叫什麼名字？</label><input id="nm" maxlength="12" placeholder="例如：阿福、Nova（隨你取）">
    <label for="ps">2. 它說話的個性？（可以先空白）</label><textarea id="ps" placeholder="例如：像毒舌但可靠的學姊；預設是簡潔、會先問再動手"></textarea>
    <div class="row" style="margin-top:12px"><button id="nmGo">就叫這個名字</button><span id="nmErr" class="err"></span></div></div>
</section>

<section id="app" hidden>
  <div class="row" style="justify-content:space-between"><div><h1 id="hi"></h1><span class="tag" id="who"></span> <span class="tag ok" id="saved">已儲存</span></div><button id="out" class="ghost">登出</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</section>

<section id="fatal" hidden><div class="card"><h2>出了點問題</h2><p id="fatalMsg" class="err"></p></div></section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="lab.js?v=2"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var MODELS = ['gemini-2.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-3-flash-preview'];   /* 實際可用型號由楊老師的代理程式再限制一次 */
  var JARVIS_ON = false;   /* Jarvis（學生自己的 Claude CLI 助理）等楊老師交付 Pro 帳號後才開：改 true 即恢復取名、接手與設定欄位 */
  var DEFAULT_CAP = 1000;   /* 台幣，整個實驗期間累積；增加要楊老師核准（寫入 lab/spend/<代碼>/capNtd） */
  var ctx, P, S, G = {}, tab = 'home', timer = null;

  function blank() { return { v: 1, chars: [], scenes: [], story: { concept: '', playerRole: '', opening: '', goal: '', ending: '', gm: '', breakWall: false } }; }

  function renderPane() { var p = $('pane'); p.innerHTML = ''; ({ home: pHome, chars: pChars, scenes: pScenes, story: pStory, chat: pChat, evo: pEvo, set: pSet })[tab](p); }

  function pHome(p) {

    var cp = el('button', { class: 'ghost', text: '複製' }); cp.onclick = function () { try { navigator.clipboard.writeText(line); } catch (e) {} };

    P.chars.forEach(function (c, i) { var card = el('div', { class: 'card' }); card.appendChild(el('h2', { text: '角色 ' + (i + 1) + (c.name ? '：' + c.name : '') }));

    if (P.scenes.length < 2) { var a = el('button', { text: '＋ 新增場景' }); a.onclick = function () { P.scenes.push({ name: '', mood: '', rooms: [{ name: '', desc: '' }] }); save(); ev('addScene'); renderPane(); }; p.appendChild(a); } }

    card.appendChild(field('開場事件', st.opening, function (v) { st.opening = v; }, { multi: 1, id: 'sto' }));
    card.appendChild(field('目標', st.goal, function (v) { st.goal = v; }, { id: 'stg' }));
    card.appendChild(field('結局（怎樣算結束）', st.ending, function (v) { st.ending = v; }, { multi: 1, id: 'ste' }));
    var gl = el('label', { text: '主持人（GM）：由哪個角色引導故事？', for: 'stgm' }), gs = el('select', { id: 'stgm' }); gs.appendChild(el('option', { value: '', text: '（不設主持人）' }));
    P.chars.forEach(function (c, i) { var o = el('option', { value: String(i), text: c.name || ('角色 ' + (i + 1)) }); if (String(st.gm) === String(i)) o.selected = true; gs.appendChild(o); });
    gs.onchange = function () { st.gm = gs.value; save(); }; card.appendChild(el('div', {}, [gl, gs]));
    var bw = el('input', { type: 'checkbox', id: 'stbw' }); bw.checked = !!st.breakWall; bw.style.width = 'auto'; bw.onchange = function () { st.breakWall = bw.checked; save(); };
    card.appendChild(el('div', { class: 'row', style: 'margin-top:12px' }, [bw, el('label', { text: '打破第四面牆（玩家其實是外面的設計師，可以進去改變角色或環境）', for: 'stbw', style: 'margin:0' })]));
    p.appendChild(card); }

  /* 進化：每一代的修改前後、分數與理由；候選版本由她接受或退回 */
  function fv(x) { return Array.isArray(x) ? x.join('\n') : String(x == null ? '' : x); }
  function gensList() { return Object.keys(G).map(function (k) { var o; try { o = JSON.parse(G[k]); } catch (e) { return null; } if (o) o._id = k; return o; }).filter(Boolean).sort(function (a, b) { return (b.g || 0) - (a.g || 0); }); }
  function setVerdict(g, v) { g.v = v; var o = {}; Object.keys(g).forEach(function (k) { if (k !== '_id') o[k] = g[k]; }); G[g._id] = JSON.stringify(o); return ctx.db.set(path('gens/' + g._id), G[g._id]); }
  var VL = { candidate: ['等你決定', 'warn'], accepted: ['你接受了', 'ok'], rejected: ['你退回了', ''] };
  function pEvo(p) {
    var gs = gensList();
    p.appendChild(el('div', { class: 'card' }, [el('h2', { text: '角色怎麼一代一代變聰明' }),
      el('p', { text: '系統會根據你的標註，替角色提出修改版本（候選）。每一代都記在這裡：改了哪個欄位、改之前和改之後、為什麼、測驗分數。你接受才會生效，退回的也會留下來，並成為下一代的參考。' }),
      el('p', { class: 'muted', text: '新的候選版本必須通過兩關：舊的好例子一題都不能退步，而且至少一題變好；碰到紅線（洩漏設定、扮演真人、醫療建議）一律不過。' })]));
    if (!gs.length) { p.appendChild(el('div', { class: 'card' }, [el('h2', { text: '還沒有進化紀錄' }), el('p', { text: '累積約 10 題你的標註（「像／不像」「卡住」）之後，系統才會開始提出候選。在那之前，把角色的設定寫得具體一點，效果最大。' })])); return; }
    gs.forEach(function (g) { var vl = VL[g.v] || ['', ''], c = P.chars[g.ci] || {}, card = el('div', { class: 'card' });
      card.appendChild(el('div', { class: 'row' }, [el('h2', { text: '第 ' + g.g + ' 代', style: 'margin:0' }), el('span', { class: 'tag ' + vl[1], text: vl[0] }), el('span', { class: 'muted', text: (c.name || '角色 ' + ((g.ci || 0) + 1)) + '　' + (g.f || '') + '　' + (g.t ? new Date(g.t).toLocaleString('zh-TW') : '') })]));
      if (g.why) card.appendChild(el('p', { text: '為什麼改：' + g.why }));
      var s = g.s || {}; card.appendChild(el('p', { class: 'muted', text: '測驗：好例子 ' + ((s.gold || [0, 0])[0]) + ' / ' + ((s.gold || [0, 0])[1]) + ' 題維持或變好　紅線違反 ' + (s.redline || 0) + ' 次' })); if (s.low) card.appendChild(el('p', { class: 'muted', text: '「像」的例子還不到 10 個，這一代先當建議看，多標一些會更準。' }));
      card.appendChild(el('div', { class: 'grid' }, [el('div', {}, [el('label', { text: '改之前' }), el('pre', { text: fv(g.b), style: 'white-space:pre-wrap;margin:0;background:var(--soft-r);padding:8px;border-radius:var(--r-s)' })]),
        el('div', {}, [el('label', { text: '改之後' }), el('pre', { text: fv(g.a), style: 'white-space:pre-wrap;margin:0;background:var(--soft-g);padding:8px;border-radius:var(--r-s)' })])]));
      if (g.v === 'candidate') { var ok = el('button', { text: '接受這一代' }), no = el('button', { class: 'ghost', text: '退回' });
        ok.onclick = function () { var ch = P.chars[g.ci]; if (ch && g.f) { ch[g.f] = Array.isArray(ch[g.f]) ? unlines(fv(g.a)) : fv(g.a); } setVerdict(g, 'accepted').then(function () { save(); ev('gen-accept'); renderPane(); }); };
        no.onclick = function () { setVerdict(g, 'rejected').then(function () { ev('gen-reject'); renderPane(); }); };
        card.appendChild(el('div', { class: 'row', style: 'margin-top:10px' }, [ok, no])); }
      p.appendChild(card); }); }


  /* 試聊：和自己的角色說話，並標「像／不像／卡住」。標註是進化（RSI）的輸入。 */
  var chatCi = 0, chatPoll = null;
  function pChat(p) {
    if (!P.chars.length) { p.appendChild(el('div', { class: 'card' }, [el('h2', { text: '先做一個角色' }), el('p', { text: '到「角色」頁寫好一個角色，再回來和他說話。' })])); return; }
    if (chatCi >= P.chars.length) chatCi = 0;
    var top = el('div', { class: 'card' }), sel = el('select', { id: 'chc' });
    P.chars.forEach(function (c, i) { var o = el('option', { value: String(i), text: c.name || ('角色 ' + (i + 1)) }); if (i === chatCi) o.selected = true; sel.appendChild(o); });
    sel.onchange = function () { chatCi = Number(sel.value); renderPane(); };
    top.appendChild(el('label', { text: '要跟誰說話', for: 'chc' })); top.appendChild(sel);
    top.appendChild(el('p', { class: 'muted', text: '跟他聊幾句，每一句回覆下面按「像」「不像」或「卡住」。不像的話寫一句哪裡不像，系統才知道怎麼改。' }));
    var info = el('div', { class: 'muted', id: 'chinfo' }); top.appendChild(info); p.appendChild(top);
    var box = el('div', { class: 'card', id: 'chbox' }, [el('div', { class: 'muted', text: '讀取對話…' })]); p.appendChild(box);
    var inp = el('textarea', { id: 'chm', placeholder: '對' + (P.chars[chatCi].name || '他') + '說的話（最多 300 字）' }), go = el('button', { text: '送出', id: 'chgo' });
    var msg = el('span', { class: 'muted', id: 'chmsg' });
    p.appendChild(el('div', { class: 'card' }, [el('label', { text: '你說', for: 'chm' }), inp, el('div', { class: 'row', style: 'margin-top:8px' }, [go, msg])]));
    function render(reqs, outs, marks) {
      box.innerHTML = ''; var ids = Object.keys(reqs).sort(), n = 0;
      ids.forEach(function (id) { var rq = J(reqs[id]) || {}; if (Number(rq.c || 0) !== chatCi) return; n++;
        box.appendChild(el('div', { style: 'margin:6px 0;text-align:right' }, [el('span', { class: 'tag', text: '你：' + (rq.m || '') })]));
        var ou = J(outs[id]); var m = J(marks[id]);

        if (ou.err) { box.appendChild(el('div', { class: 'tag warn', text: ({ cap: '你的額度用完了，需要增加請向楊老師提出。', 'cap-global': '今天全部人的總額度用完了，明天再試。', nochar: '找不到這個角色，先到角色頁確認。' })[ou.err] || '這次沒有回成功，再送一次。' })); return; }
        var b = el('div', { class: 'card', style: 'margin:6px 0;padding:8px 12px' }); b.appendChild(el('div', { text: (P.chars[chatCi].name || '角色') + '：' + ou.text }));
        var row = el('div', { class: 'row', style: 'margin-top:6px' });
        [['like', '像'], ['unlike', '不像'], ['stuck', '卡住']].forEach(function (x) { var bt = el('button', { text: x[1], class: (m && m.v === x[0]) ? '' : 'ghost' }); bt.onclick = function () { markIt(id, x[0], note.value); }; row.appendChild(bt); });
        var note = el('input', { placeholder: '哪裡不像／卡在哪（一句話，可不寫）', 'aria-label': '備註' }); note.value = (m && m.n) || ''; row.appendChild(note);
        b.appendChild(row); if (m) b.appendChild(el('div', { class: 'muted', text: '已標：' + ({ like: '像', unlike: '不像', stuck: '卡住' })[m.v] })); box.appendChild(b); });
      if (!n) box.appendChild(el('div', { class: 'muted', text: '還沒聊過。先說一句吧。' }));
      box.scrollTop = box.scrollHeight;
    }
    function markIt(id, v, note) { var o = JSON.stringify({ o: id, c: chatCi, v: v, n: String(note || '').slice(0, 200), t: Date.now() });
      ctx.db.set(path('marks/' + id), o).then(function () { ev('mark-' + v); load(); }).catch(function () { $('chmsg').textContent = '標註沒存成功'; }); }
    function load() { Promise.all([ctx.db.get(path('req')), ctx.db.get(path('out')), ctx.db.get(path('marks')), ctx.db.get('lab/spend/' + ctx.code)]).then(function (r) {
      var sp = r[3] || {}, cap = (sp.capNtd === undefined || sp.capNtd === null) ? DEFAULT_CAP : Number(sp.capNtd), used = Number(sp.ntd) || 0;
      info.textContent = '目前型號：' + (S.model || MODELS[0]) + '　累積 NT$ ' + fmt(used) + ' ／ ' + fmt(cap); go.disabled = used >= cap; if (used >= cap) $('chmsg').textContent = '額度用完了，需要增加請向楊老師提出。';
      render(r[0] || {}, r[1] || {}, r[2] || {}); var pend = Object.keys(r[0] || {}).some(function (k) { return !(r[1] || {})[k]; });
      clearTimeout(chatPoll); if (pend && tab === 'chat') chatPoll = setTimeout(load, 1500);
    }).catch(function (e) { box.textContent = '讀不到對話：' + (e && e.code || e); }); }
    go.onclick = function () { var m = inp.value.trim(); if (!m) { $('chmsg').textContent = '先打一句話'; return; } if (m.length > 300) { $('chmsg').textContent = '太長了，300 字內'; return; }
      var id = 'r' + Date.now(); go.disabled = true; $('chmsg').textContent = '';
      ctx.db.set(path('req/' + id), JSON.stringify({ c: chatCi, m: m, t: Date.now() })).then(function () { inp.value = ''; ev('chat'); go.disabled = false; load(); }).catch(function (e) { go.disabled = false; $('chmsg').textContent = '送出失敗：' + (e && e.code || e); }); };
    load();
  }
  function J(s) { try { return JSON.parse(s); } catch (e) { return null; } }

  function pSet(p) { var card = el('div', { class: 'card' });
    if (JARVIS_ON) card.appendChild(field('助理的名字', S.jarvisName, function (v) { S.jarvisName = v; $('hi').textContent = (v || '助理') + ' 在這裡'; clearTimeout(pSet.t); pSet.t = setTimeout(saveSettings, 800); }, { id: 'sjn' }));
    var ml = el('label', { text: '場上角色用哪個 AI 型號', for: 'smd' }), ms = el('select', { id: 'smd' }); MODELS.forEach(function (m) { var o = el('option', { value: m, text: m }); if ((S.model || MODELS[0]) === m) o.selected = true; ms.appendChild(o); });
    ms.onchange = function () { S.model = ms.value; saveSettings().then(function () { ev('model'); }); }; card.appendChild(el('div', {}, [ml, ms]));
    card.appendChild(el('p', { class: 'muted', text: '型號清單由楊老師決定。' }));
    p.appendChild(card);
    /* 累積花費與上限（由代理程式記帳寫入 lab/spend，你只能看不能改） */
    var sp = el('div', { class: 'card' }); sp.appendChild(el('h2', { text: '累積花費' })); var body = el('div', { text: '讀取中…', class: 'muted' }); sp.appendChild(body); p.appendChild(sp);
    ctx.db.get('lab/spend/' + ctx.code).then(function (x) {
      x = x || {}; var used = Number(x.ntd) || 0, cap = (x.capNtd === undefined || x.capNtd === null) ? DEFAULT_CAP : Number(x.capNtd), pct = cap > 0 ? Math.min(100, Math.round(used / cap * 100)) : 100;
      var full = used >= cap, near = !full && pct >= 80;
      body.className = ''; body.textContent = '';
      body.appendChild(el('div', { class: 'row' }, [el('strong', { text: 'NT$ ' + fmt(used) + ' ／ NT$ ' + fmt(cap), style: 'font-size:20px' }), el('span', { class: 'tag ' + (full ? 'warn' : (near ? '' : 'ok')), text: full ? '已用完，場上角色暫停' : (near ? '快用完了（' + pct + '%）' : '已用 ' + pct + '%') })]));
      body.appendChild(el('div', { style: 'height:14px;margin:8px 0;border:var(--bw-s) solid var(--ink);border-radius:var(--r-pill);background:var(--panel);overflow:hidden' }, [el('div', { style: 'height:100%;width:' + pct + '%;background:' + (full ? 'var(--pop)' : 'var(--mint)') })]));
      body.appendChild(el('div', { class: 'muted', text: '目前型號：' + (S.model || MODELS[0]) + '　場上對話 ' + fmt(x.calls || 0) + ' 次　token 入 ' + fmt(x.tokIn || 0) + '／出 ' + fmt(x.tokOut || 0) }));
      body.appendChild(el('div', { class: 'muted', text: x.updatedAt ? '記帳更新：' + new Date(x.updatedAt).toLocaleString('zh-TW') : '還沒有任何花費紀錄。' }));
      body.appendChild(el('p', { class: 'muted', text: '這是整個實驗期間的累積上限。需要增加，請向楊老師提出。' }));
    }).catch(function (e) { body.textContent = '讀不到花費資料：' + (e && e.code || e); });
  }
  function fmt(n) { n = Number(n) || 0; return n.toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }

  /* 啟動 */
  function boot(c) {
    ctx = c; if (!ctx.code) { ctx.code = ctx.isAdmin ? 'lab-admin-preview' : null; }
    $('who').textContent = ctx.email;
    Promise.all([ctx.db.get(path('settings')), ctx.db.get(path('project')), ctx.db.get(path('gens'))]).then(function (r) {
      S = r[0] || {}; G = r[2] || {}; try { P = r[1] ? JSON.parse(r[1]) : blank(); } catch (e) { P = blank(); }
      P.chars = P.chars || []; P.scenes = P.scenes || []; P.story = P.story || blank().story;
      if (JARVIS_ON && !S.jarvisName) { show('naming'); return; } enter();
    }).catch(function (e) { fatal('讀取你的資料失敗：' + (e && e.code || e)); });
  }
  function enter() { $('hi').textContent = JARVIS_ON ? S.jarvisName + ' 在這裡' : '提案室·實驗工坊'; show('app'); renderTabs(); renderPane(); ev('open'); }
  function fatal(m) { $('fatalMsg').textContent = m; show('fatal'); }

  $('nmGo').onclick = function () { var n = $('nm').value.trim(); if (!n) { $('nmErr').textContent = '先取個名字喔'; return; }
    S = { jarvisName: n, model: MODELS[0], persona: $('ps').value.trim() }; saveSettings().then(function () { ev('named'); enter(); }).catch(function (e) { $('nmErr').textContent = '儲存失敗：' + (e && e.code || e); }); };
  $('out').onclick = function () { LAB.signOut(); }; $('deniedOut').onclick = function () { LAB.signOut(); };
  $('gBtn').onclick = function () { $('loginMsg').textContent = '登入中…（會跳出 Google 的視窗）'; var r = LAB.signIn(); if (r && r.catch) r.catch(function (e) { $('loginMsg').textContent = '登入沒有完成：' + (e && e.code || e); }); };
  if (LAB.mock) { $('mockBox').hidden = false; $('gBtn').hidden = true; $('mockGo').onclick = function () { try { localStorage.setItem('labmock.email', $('mockEmail').value.trim().toLowerCase()); } catch (e) {} location.reload(); }; }
  LAB.start({ onReady: boot, onSignedOut: function () { show('login'); },
    onDenied: function (m) { $('deniedMail').textContent = m; show('denied'); }, onError: fatal });
})();
</script></body></html>
